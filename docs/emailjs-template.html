<div style="background: #f6f5f0; color: #1b2a27; font-family: Arial, sans-serif; padding: 32px 20px;">
  <div style="max-width: 600px; margin: 0 auto;">
    <p style="font-size: 22px; font-weight: 700; margin: 0 0 28px;">duokimaxis.</p>
    <h1 style="font-size: 26px; margin: 0 0 24px;">New project inquiry</h1>
    <table role="presentation" style="border-collapse: collapse; width: 100%;">
      <tr>
        <td style="padding: 8px 16px 8px 0; vertical-align: top; font-weight: 700;">Name</td>
        <td style="padding: 8px 0;">{{from_name}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 16px 8px 0; vertical-align: top; font-weight: 700;">Email</td>
        <td style="padding: 8px 0;">{{reply_to}}</td>
      </tr>
      <tr>
        <td style="padding: 8px 16px 8px 0; vertical-align: top; font-weight: 700;">Interested in</td>
        <td style="padding: 8px 0;">{{service}}</td>
      </tr>
    </table>
    <h2 style="font-size: 18px; margin: 28px 0 12px;">Message</h2>
    <div style="background: #ffffff; padding: 20px; white-space: pre-wrap; overflow-wrap: anywhere;">{{message}}</div>
    <p style="color: #59645e; font-size: 14px; line-height: 1.6; margin: 24px 0 0;">
      Sent from the contact form at duokimaxis.com. Reply to this email to contact the sender.
    </p>
  </div>
</div>
